[package]
name = "bouncer"
version = "0.11.0"
edition = "2024"

[package.metadata.tui-utils]
config_isolation = "home"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
frizbee = "0.13.0"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1.26"
ureq = "3"

[dev-dependencies]
tempfile = "3"
